apiVersion: apps/v1
kind: Deployment

metadata:
  name: aws-java-app
  namespace: devops-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: aws-java-app

  template:
    metadata:
      labels:
        app: aws-java-app

    spec:
      containers:
        - name: aws-java-app

          image: nginx:stable

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080

            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080

            initialDelaySeconds: 40
            periodSeconds: 20